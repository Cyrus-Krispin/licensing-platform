name: Dispatch Codex cloud
on:
  issues:
    types: [labeled]
permissions:
  contents: read
  issues: write
concurrency:
  group: codex-cloud-dispatch
  cancel-in-progress: false
jobs:
  dispatch:
    if: github.event.label.name == 'codex:ready' && github.event.sender.type == 'User'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const dispatch = require('./.github/scripts/dispatch-codex.cjs');
            await dispatch({github, context, core});
