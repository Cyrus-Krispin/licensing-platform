name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run check
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: frontend-coverage
          path: frontend/coverage
          retention-days: 7
          if-no-files-found: error

  backend:
    name: Backend PostgreSQL checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.0.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Start PostgreSQL with an ephemeral password
        run: |
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          echo "DATABASE_PASSWORD=$password" >> "$GITHUB_ENV"
          docker run --detach --rm --name licensing-ci-postgres \
            --env POSTGRES_DB=licensing_test \
            --env POSTGRES_USER=test \
            --env POSTGRES_PASSWORD="$password" \
            --publish 5432:5432 postgres:17.6-alpine
          for attempt in {1..30}; do
            docker exec licensing-ci-postgres pg_isready -U test -d licensing_test && exit 0
            sleep 2
          done
          docker logs licensing-ci-postgres
          exit 1
      - name: Test and package against PostgreSQL
        working-directory: backend
        run: >-
          ./mvnw --batch-mode verify
          -Dspring.datasource.url=jdbc:postgresql://localhost:5432/licensing_test
          -Dspring.datasource.username=test
          -Dspring.datasource.password="$DATABASE_PASSWORD"
      - name: Stage packaged JAR for rootfs scanning
        run: |
          mkdir -p backend/target/trivy-rootfs
          cp backend/target/backend-0.1.0.jar backend/target/trivy-rootfs/
      - name: Scan packaged backend dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: rootfs
          scan-ref: backend/target/trivy-rootfs
          scanners: vuln
          severity: CRITICAL,HIGH
          format: json
          output: backend/target/trivy-packaged.json
          list-all-pkgs: true
          exit-code: "0"
      - name: Verify packaged backend inventory and findings
        run: |
          report=backend/target/trivy-packaged.json
          java_packages=$(jq '[.Results[]?.Packages[]? | select(.Identifier.PURL? | startswith("pkg:maven/"))] | length' "$report")
          test "$java_packages" -gt 0 || { echo "Trivy found no Java packages in the packaged JAR" >&2; exit 1; }
          for package in \
            'pkg:maven/org.springframework.boot/spring-boot-actuator@3.5.16' \
            'pkg:maven/org.postgresql/postgresql@42.7.12' \
            'pkg:maven/com.fasterxml.jackson.core/jackson-core@2.21.7' \
            'pkg:maven/com.fasterxml.jackson.core/jackson-databind@2.21.7' \
            'pkg:maven/org.apache.tomcat.embed/tomcat-embed-core@10.1.59'; do
            jq --exit-status --arg package "$package" \
              'any(.Results[]?.Packages[]?; .Identifier.PURL? == $package)' "$report" >/dev/null || {
                echo "Expected packaged dependency is missing: $package" >&2
                exit 1
              }
          done
          vulnerabilities=$(jq '[.Results[]?.Vulnerabilities[]?] | length' "$report")
          test "$vulnerabilities" -eq 0 || {
            echo "Trivy found $vulnerabilities high/critical packaged dependency vulnerabilities" >&2
            jq -r '.Results[]?.Vulnerabilities[]? | "\(.Severity) \(.VulnerabilityID) \(.PkgName) \(.InstalledVersion)"' "$report"
            exit 1
          }
          echo "Verified $java_packages packaged Java dependencies and no high/critical findings"
      - name: Upload packaged dependency inventory
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: backend-packaged-dependency-inventory
          path: backend/target/trivy-packaged.json
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: backend-jacoco
          path: backend/target/site/jacoco
          retention-days: 7
          if-no-files-found: error
      - if: always()
        run: docker rm --force licensing-ci-postgres || true

  security:
    name: Dependency and secret scans
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks OSS CLI
        run: |
          curl --fail --location --silent --show-error \
            --output gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
      - name: Scan full Git history
        run: gitleaks git --redact --verbose .
      - name: Scan declared npm and Maven manifest data
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: "1"
      - name: Explain source manifest scan boundary
        run: echo "Source manifest scanning covers declared lockfile/POM data; the backend job separately scans packaged JAR transitives with Trivy rootfs."

  compose:
    name: Compose security and browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Generate ephemeral Compose database password
        run: |
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          echo "DATABASE_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Build and start Compose
        run: docker compose up --build --wait --wait-timeout 180
      - name: API security, seeding, and restart persistence
        run: ./ci/smoke.sh
      - name: Install browser dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Two-role browser flow
        working-directory: frontend
        run: npx playwright test
      - name: Scan backend image
        id: backend-image-scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: licensing-platform-backend:local
          severity: CRITICAL,HIGH
          format: json
          output: trivy-backend-image.json
          list-all-pkgs: true
          exit-code: "1"
      - name: Scan frontend image
        if: ${{ always() }}
        id: frontend-image-scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: licensing-platform-frontend:local
          severity: CRITICAL,HIGH
          format: json
          output: trivy-frontend-image.json
          list-all-pkgs: true
          exit-code: "1"
      - name: Verify both image scan inventories
        if: ${{ always() }}
        run: |
          failed=0
          for image in backend frontend; do
            report="trivy-$image-image.json"
            if ! test -s "$report"; then
              echo "Missing Trivy inventory for $image image" >&2
              failed=1
              continue
            fi
            packages=$(jq '[.Results[]?.Packages[]?] | length' "$report")
            if test "$packages" -eq 0; then
              echo "Trivy found no packages in $image image" >&2
              failed=1
            else
              echo "Trivy inventoried $packages packages in $image image"
            fi
            vulnerabilities=$(jq '[.Results[]?.Vulnerabilities[]?] | length' "$report")
            if test "$vulnerabilities" -ne 0; then
              echo "Trivy found $vulnerabilities high/critical vulnerabilities in $image image" >&2
              failed=1
            fi
          done
          exit "$failed"
      - name: Capture bounded failure logs
        if: failure()
        run: docker compose logs --no-color --tail=500 > compose.log
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: ${{ !cancelled() }}
        with:
          name: browser-and-compose-evidence
          path: |
            frontend/playwright-report
            frontend/test-results
            compose.log
            trivy-backend-image.json
            trivy-frontend-image.json
          retention-days: 7
          if-no-files-found: warn
      - if: always()
        run: docker compose down
