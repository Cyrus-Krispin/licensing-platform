name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 20.20.0, cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
        working-directory: frontend
      - run: npm run lint && npm run typecheck && npm test && npm run build
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: frontend-coverage, path: frontend/coverage, retention-days: 7, if-no-files-found: error}
  backend:
    name: Backend PostgreSQL checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.6-alpine
        env: {POSTGRES_DB: licensing_test, POSTGRES_USER: test, POSTGRES_PASSWORD: ephemeral-ci-password}
        ports: ['5432:5432']
        options: --health-cmd="pg_isready -U test -d licensing_test" --health-interval=5s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '21', cache: maven}
      - run: ./mvnw --batch-mode verify -Dspring.datasource.url=jdbc:postgresql://localhost:5432/licensing_test -Dspring.datasource.username=test -Dspring.datasource.password=ephemeral-ci-password
        working-directory: backend
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: backend-jacoco, path: backend/target/site/jacoco, retention-days: 7, if-no-files-found: error}
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env: {GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
  compose:
    name: Compose security smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: docker compose up --build --wait --wait-timeout 180
      - run: ./ci/smoke.sh
      - name: Verify seed and persistence
        run: |
          test "$(docker compose exec -T db psql -U licensing -d licensing -Atc 'select count(*) from app_user')" = 2
          docker compose restart backend
          docker compose up --wait --wait-timeout 120
          ./ci/smoke.sh
          test "$(docker compose exec -T db psql -U licensing -d licensing -Atc 'select count(*) from app_user')" = 2
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with: {scan-type: image, image-ref: licensing-platform-backend:latest, severity: 'CRITICAL,HIGH', ignore-unfixed: true, exit-code: '1'}
      - name: Capture failure logs
        if: failure()
        run: docker compose logs --no-color --tail=500 > compose.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with: {name: compose-failure-logs, path: compose.log, retention-days: 7}
      - if: always()
        run: docker compose down
