name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version: 20.20.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run check
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: frontend-coverage
          path: frontend/coverage
          retention-days: 7
          if-no-files-found: error

  backend:
    name: Backend PostgreSQL checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.0.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Start PostgreSQL with an ephemeral password
        run: |
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          echo "DATABASE_PASSWORD=$password" >> "$GITHUB_ENV"
          docker run --detach --rm --name licensing-ci-postgres \
            --env POSTGRES_DB=licensing_test \
            --env POSTGRES_USER=test \
            --env POSTGRES_PASSWORD="$password" \
            --publish 5432:5432 postgres:17.6-alpine
          for attempt in {1..30}; do
            docker exec licensing-ci-postgres pg_isready -U test -d licensing_test && exit 0
            sleep 2
          done
          docker logs licensing-ci-postgres
          exit 1
      - name: Test and package against PostgreSQL
        working-directory: backend
        run: >-
          ./mvnw --batch-mode verify
          -Dspring.datasource.url=jdbc:postgresql://localhost:5432/licensing_test
          -Dspring.datasource.username=test
          -Dspring.datasource.password="$DATABASE_PASSWORD"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: backend-jacoco
          path: backend/target/site/jacoco
          retention-days: 7
          if-no-files-found: error
      - if: always()
        run: docker rm --force licensing-ci-postgres || true

  security:
    name: Dependency and secret scans
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks OSS CLI
        run: |
          curl --fail --location --silent --show-error \
            --output gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
      - name: Scan full Git history
        run: gitleaks git --redact --verbose .
      - name: Scan npm and Maven dependency manifests
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: "1"

  compose:
    name: Compose security and browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version: 20.20.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Generate ephemeral Compose database password
        run: |
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          echo "DATABASE_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Build and start Compose
        run: docker compose up --build --wait --wait-timeout 180
      - name: API security, seeding, and restart persistence
        run: ./ci/smoke.sh
      - name: Install browser dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Two-role browser flow
        working-directory: frontend
        run: npx playwright test
      - name: Scan backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: licensing-platform-backend:local
          severity: CRITICAL,HIGH
          exit-code: "1"
      - name: Scan frontend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: licensing-platform-frontend:local
          severity: CRITICAL,HIGH
          exit-code: "1"
      - name: Capture bounded failure logs
        if: failure()
        run: docker compose logs --no-color --tail=500 > compose.log
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: ${{ !cancelled() }}
        with:
          name: browser-and-compose-evidence
          path: |
            frontend/playwright-report
            frontend/test-results
            compose.log
          retention-days: 7
          if-no-files-found: warn
      - if: always()
        run: docker compose down
