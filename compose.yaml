services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: licensing
      POSTGRES_USER: licensing
      POSTGRES_PASSWORD: local-only-database-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U licensing -d licensing"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes: [postgres-data:/var/lib/postgresql/data]
  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DATABASE_URL: jdbc:postgresql://db:5432/licensing
      DATABASE_USER: licensing
      DATABASE_PASSWORD: local-only-database-password
      FILE_STORAGE_PATH: /var/lib/licensing/files
      SECURE_COOKIES: "false"
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes: [private-files:/var/lib/licensing/files]
  frontend:
    build: ./frontend
    ports: ["8080:80"]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
  private-files:
