server {
  listen 80;
  # The backend enforces the inclusive 10,000,000-byte file limit. This only
  # reserves bounded room for multipart framing and headers.
  client_max_body_size 11m;

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location = /health {
    access_log off;
    return 200 'ok';
    add_header Content-Type text/plain;
  }
}
