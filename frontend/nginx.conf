server { listen 80; location / { root /usr/share/nginx/html; try_files $uri /index.html; } location /api/ { proxy_pass http://backend:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; } location = /health { access_log off; return 200 'ok'; add_header Content-Type text/plain; } }
