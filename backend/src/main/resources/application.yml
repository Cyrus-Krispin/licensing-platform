spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
  session:
    jdbc:
      initialize-schema: never
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SECURE_COOKIES:true}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

licensing:
  file-storage-path: ${FILE_STORAGE_PATH:./data/private-files}
